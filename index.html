<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K1 hookah lounge</title>
<meta name="theme-color" content="#1e1e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K1">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
html,body{margin:0;height:100%;background:#1e1e1e;overflow:hidden}
iframe{position:fixed;left:0;top:env(safe-area-inset-top,0px);width:100%;height:100%;border:0;display:block;background:#181818}
#safe{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:0;right:0;visibility:hidden;pointer-events:none}
.wait{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#d2cdbf;font:15px -apple-system,system-ui,sans-serif;pointer-events:none;transition:opacity .3s}
.wait img{width:120px;height:120px;border-radius:24px}
</style>
</head>
<body>
<!-- Обёртка K1: своя иконка на экране телефона, внутри приложение Apps Script -->
<div class="wait" id="wait"><img src="icon-192.png" alt="K1"><span>Загружаю…</span></div>
<div id="safe"></div>
<iframe id="app" allow="clipboard-write" title="K1 hookah lounge"></iframe>
<script>
// iPhone с иконки: приложение ставим ниже часов/«брови» и растягиваем на видимую высоту.
var ifr = document.getElementById('app'), safe = document.getElementById('safe');
// Приложение на всю видимую высоту, фон уходит под часы; отступ под «бровь» приложение делает само (?st=)
function fit() { ifr.style.top = '0px'; ifr.style.height = window.innerHeight + 'px'; }
fit();
var st = Math.max(0, Math.round(safe.getBoundingClientRect().top));
ifr.src = 'https://script.google.com/macros/s/AKfycbzNnu1UctMaM-4-pzrzjoOdDUrZjQAzf22vXoosDZeilK6izq5mPDH9bAw3vqiNGPz7/exec?st=' + st + '&sb=0';
ifr.onload = function () { fit(); var w = document.getElementById('wait'); w.style.opacity = 0; setTimeout(function () { w.remove(); }, 400); };
window.addEventListener('resize', fit); window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
// временно: замеры экрана для настройки (видны 10 секунд внизу)
(function () {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:9;font:11px -apple-system;color:#ffd23f;background:rgba(0,0,0,.7);padding:6px;border-radius:8px;pointer-events:none';
  setTimeout(function () {
    var r = safe.getBoundingClientRect(), vv = window.visualViewport;
    d.textContent = 'ih ' + innerHeight + ' sh ' + screen.height + ' ch ' + document.documentElement.clientHeight + ' vv ' + (vv ? Math.round(vv.height) : '-') + ' top ' + Math.round(r.top) + ' bot ' + Math.round(innerHeight - r.bottom) + ' st ' + st + ' sa ' + (navigator.standalone ? 1 : 0);
    document.body.appendChild(d); setTimeout(function () { d.remove(); }, 10000);
  }, 1500);
})();
// Запомненный вход хранит обёртка: внутри iframe iPhone не даёт приложению своё хранилище
window.addEventListener('message', function (e) {
  if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin) || !e.data || e.data.k1 !== 1) return;
  try {
    if (e.data.op === 'get') e.source.postMessage({ k1: 1, op: 'cred', v: JSON.parse(localStorage.getItem('k1cred') || 'null') }, e.origin);
    else if (e.data.op === 'set') localStorage.setItem('k1cred', JSON.stringify(e.data.v));
    else if (e.data.op === 'clear') localStorage.removeItem('k1cred');
    else if (e.data.op === 'reload') setTimeout(function () { location.reload(); }, 150);
  } catch (err) {}
});
</script>
</body>
</html>
