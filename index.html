<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K1 hookah lounge</title>
<meta name="theme-color" content="#181818">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K1">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
html,body{margin:0;height:100%;background:#181818;overflow:hidden}
body{padding:env(safe-area-inset-top) 0 0;box-sizing:border-box}
iframe{border:0;width:100%;height:100%;display:block;background:#181818}
.wait{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#d2cdbf;font:15px -apple-system,system-ui,sans-serif;pointer-events:none;transition:opacity .3s}
.wait img{width:120px;height:120px;border-radius:24px}
</style>
</head>
<body>
<!-- Обёртка K1: своя иконка на экране телефона, внутри приложение Apps Script -->
<div class="wait" id="wait"><img src="icon-192.png" alt="K1"><span>Загружаю…</span></div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbzNnu1UctMaM-4-pzrzjoOdDUrZjQAzf22vXoosDZeilK6izq5mPDH9bAw3vqiNGPz7/exec" allow="clipboard-write" title="K1 hookah lounge"></iframe>
<script>
document.getElementById('app').onload = function () { var w = document.getElementById('wait'); w.style.opacity = 0; setTimeout(function () { w.remove(); }, 400); };
</script>
</body>
</html>
