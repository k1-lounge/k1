<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K1 hookah lounge</title>
<meta name="theme-color" content="#181818">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K1">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
html,body{margin:0;height:100%;background:#181818;overflow:hidden}
iframe{position:fixed;left:0;top:env(safe-area-inset-top,0px);width:100%;height:100%;border:0;display:block;background:#181818}
#safe{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:0;right:0;visibility:hidden;pointer-events:none}
.wait{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#d2cdbf;font:15px -apple-system,system-ui,sans-serif;pointer-events:none;transition:opacity .3s}
.wait img{width:120px;height:120px;border-radius:24px}
</style>
</head>
<body>
<!-- Обёртка K1: своя иконка на экране телефона, внутри приложение Apps Script -->
<div class="wait" id="wait"><img src="icon-192.png" alt="K1"><span>Загружаю…</span></div>
<div id="safe"></div>
<iframe id="app" allow="clipboard-write" title="K1 hookah lounge"></iframe>
<script>
// iPhone с иконки: приложение ставим ниже часов/«брови», а высоту считаем от экрана целиком
// (в этом режиме iOS иногда даёт окно короче экрана — отсюда была полоса снизу).
var ifr = document.getElementById('app'), safe = document.getElementById('safe');
function fit() {
  var t = Math.max(0, Math.round(safe.getBoundingClientRect().top));
  var H = navigator.standalone ? Math.max(window.innerHeight, screen.height) : window.innerHeight;
  ifr.style.top = t + 'px'; ifr.style.height = (H - t) + 'px';
  return t;
}
var top0 = fit();
var sb = navigator.standalone && top0 > 20 ? 34 : Math.max(0, Math.round(window.innerHeight - safe.getBoundingClientRect().bottom));
ifr.src = 'https://script.google.com/macros/s/AKfycbzNnu1UctMaM-4-pzrzjoOdDUrZjQAzf22vXoosDZeilK6izq5mPDH9bAw3vqiNGPz7/exec?st=0&sb=' + sb;
ifr.onload = function () { fit(); var w = document.getElementById('wait'); w.style.opacity = 0; setTimeout(function () { w.remove(); }, 400); };
window.addEventListener('resize', fit); window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
setTimeout(fit, 300);
// Запомненный вход хранит обёртка: внутри iframe iPhone не даёт приложению своё хранилище
window.addEventListener('message', function (e) {
  if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin) || !e.data || e.data.k1 !== 1) return;
  try {
    if (e.data.op === 'get') e.source.postMessage({ k1: 1, op: 'cred', v: JSON.parse(localStorage.getItem('k1cred') || 'null') }, e.origin);
    else if (e.data.op === 'set') localStorage.setItem('k1cred', JSON.stringify(e.data.v));
    else if (e.data.op === 'clear') localStorage.removeItem('k1cred');
  } catch (err) {}
});
</script>
</body>
</html>
