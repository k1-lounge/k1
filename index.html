<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K1 hookah lounge</title>
<meta name="theme-color" content="#181818">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K1">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
html,body{margin:0;height:100%;background:#181818;overflow:hidden}
iframe{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;background:#181818}
#safe{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:0;right:0;visibility:hidden;pointer-events:none}
.wait{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#d2cdbf;font:15px -apple-system,system-ui,sans-serif;pointer-events:none;transition:opacity .3s}
.wait img{width:120px;height:120px;border-radius:24px}
</style>
</head>
<body>
<!-- Обёртка K1: своя иконка на экране телефона, внутри приложение Apps Script -->
<div class="wait" id="wait"><img src="icon-192.png" alt="K1"><span>Загружаю…</span></div>
<div id="safe"></div>
<iframe id="app" allow="clipboard-write" title="K1 hookah lounge"></iframe>
<script>
// Приложение на весь экран, а вырезы (чёлка, полоска «домой») передаём ему параметрами: внутри iframe телефон их не сообщает
var r = document.getElementById('safe').getBoundingClientRect();
var st = Math.max(0, Math.round(r.top)), sb = Math.max(0, Math.round(window.innerHeight - r.bottom));
document.getElementById('app').src = 'https://script.google.com/macros/s/AKfycbzNnu1UctMaM-4-pzrzjoOdDUrZjQAzf22vXoosDZeilK6izq5mPDH9bAw3vqiNGPz7/exec?st=' + st + '&sb=' + sb;
document.getElementById('app').onload = function () { var w = document.getElementById('wait'); w.style.opacity = 0; setTimeout(function () { w.remove(); }, 400); };
</script>
</body>
</html>
